# SysLinuxOS Anonimo: /etc/nftables.conf starts with "flush ruleset", and
# stopping nftables.service flushes the ruleset too, which removes anonimo's
# table. Load it again right after, when anonimo is on; when it is off the
# helper does nothing. The lines are added to Debian's, none is replaced.
[Service]
ExecStartPost=-/usr/lib/syslinuxos-anonimo/anonimo-helper reapply
ExecReload=-/usr/lib/syslinuxos-anonimo/anonimo-helper reapply
ExecStopPost=-/usr/lib/syslinuxos-anonimo/anonimo-helper reapply
